# boktai1_usa_recompile.toml — gba_recompile --config for Boktai 1 USA.
#
# Schema: gbarecomp/docs/TOML_SCHEMA.md. This file supplements the function
# finder's automated walk. Entries are NOT validated for correctness — a wrong
# [[extra_func]] address generates junk code, and a too-narrow [[data_range]]
# lets the finder walk into literal pools.
#
# False-positive policy (load-bearing):
#   Missing a function  -> a runtime_dispatch_miss naming the exact PC. Cheap.
#   Data decoded as code -> junk C that may silently dispatch and corrupt
#                           state, bypassing the oracle diff. Catastrophic.
# So: lean conservative, and close gaps here deliberately.
#
# ── HISTORY: this file was rewritten 2026-07-28 ───────────────────────
# The previous version was tuned against an INTRO-PATCHED ("cracked") dump and
# almost none of it applied to the real game. That ROM had a warez intro loader
# appended at 0x08EDA900 which the reset vector branched to; it DMA'd an
# 840-byte unpacker into IWRAM at 0x03000000, which decompressed the intro to
# 0x03003000+ and only then entered the game. Everything we had configured for
# that — a [[code_copy]], crt0 [[extra_func]] seeds, and seven `resume = true`
# interior points — described the crack, not Boktai, and is gone.
#
# Verified clean dump (2026-07-28):
#   sha1 7164326283df46a3941ec7b6ceca889cbc40e660, 16 MiB
#   reset vector branches to 0x080000C0, the conventional post-header entry
#   (the patched ROM branched to 0x08EDA900, crt0 stranded at the ROM's end)
#   mGBA reaches Boktai's solar-sensor tutorial screen with no mode-4 intro

[program]
name         = "Boktai - The Sun Is in Your Hand (USA)"
id           = "boktai1_usa"
load_address = 0x08000000
size         = 0x01000000        # 16 MiB — must match the file on disk
entry_pc     = 0x08000000        # ARM B -> 0x080000C0 -> B -> 0x080001A4

[identity]
sha1 = "7164326283df46a3941ec7b6ceca889cbc40e660"
md5  = "ff75c62ab690410cc8fca24204d783e9"

# ── Data ranges: hard-exclude bytes from being decoded as code ─────────
#
# The cartridge header. 0x08000000 itself IS code (the ARM branch), so the
# exclusion starts at 0x08000004. 0x080000C0 stays code: it is the post-header
# entry the reset vector targets, and it really does branch to 0x080001A4
# (0xEA000037).
[[data_range]]
start = 0x08000004
end   = 0x080000C0               # [start, end) — Nintendo logo + cart header
note  = "Nintendo logo bytes + cartridge header fields, not code"

# The cartridge GPIO window plus the zero padding after it, up to the real code
# at 0x080001A4. Verified: all 224 bytes of 0x080000C4..0x080001A4 are 0x00.
#
# Two reasons this must be data:
#   1. The finder would otherwise decode the zeros as instructions and fall
#      through past the branch at 0x080000C0.
#   2. On Boktai 0x080000C4 / C6 / C8 is the cartridge GPIO port (GBATEK:
#      data / direction / control) carrying the Seiko S-3511A RTC and the solar
#      sensor. GpioPort services those reads; they are never instructions.
[[data_range]]
start = 0x080000C4
end   = 0x080001A4
note  = "Cartridge GPIO window (RTC + solar sensor) + zero padding, not code"

# ── Discovered entries ────────────────────────────────────────────────
# Populate [[extra_func]] / [[jump_table]] / [[code_copy]] from
# dispatch_misses.log as the interp-vs-static loop proceeds. Start empty: the
# reset vector's branch chain is statically visible in this dump, so the finder
# reaches the game without hand-holding. Do not add speculative addresses.

# ── Interior re-entry points (resume aliases) ─────────────────────────
#
# Merged from a driven run's dispatch-miss log, per the project's DISPATCH MISS
# RULE. Every one of the 120 misses in that run was an INTERIOR address of an
# already-rooted function (reported "near gf_tfunc_XXXX+0xNNN"), and none was a
# missing function entry — the finder locates entries correctly; this game
# re-enters them by computed jump (switch dispatch and exception returns).
#
# `resume = true` is the documented shape: the address is rolled into its
# containing function and emitted as a thin alias that jumps to that
# instruction, instead of being treated as a new function entry.
#
# Why this matters beyond coverage: an interior miss with a non-empty call stack
# takes stop_pc from the call-stack top, which belongs to an OUTER frame — so
# the bridge never sees its stop and runs to the 200M-instruction cap:
#   SELF-HEAL bridge for 0x081C68CE exceeded 200000000 instructions
#   without returning to stop_pc=0x081D58DE
# Covering these statically removes the runaway bridge rather than papering over
# it. 51 distinct host functions; all THUMB.

[[extra_func]]
addr   = 0x08000344
mode   = "thumb"
resume = true
note   = "interior +0x20 of gf_tfunc_08000324; computed-jump re-entry"

[[extra_func]]
addr   = 0x080030D8
mode   = "thumb"
resume = true
note   = "interior +0x2270 of gf_tfunc_08000E68; computed-jump re-entry"

