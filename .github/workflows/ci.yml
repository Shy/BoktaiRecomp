# CI — build and test everything that does NOT need the ROM.
#
# This workflow deliberately does not produce a playable artifact, and cannot:
# the recompiled sources under variants/*/generated/ are derivative of a
# copyrighted ROM, so they are gitignored and regenerated locally. CI has no ROM
# and never will. What it *can* do is prove the tree configures, compiles and
# passes the engine's suites on all three platforms, which is where portability
# regressions actually show up — this project has already hit a Windows-only
# absolute path, a PE-only linker flag, a stubbed loader, a `_start` symbol that
# collides with glibc, and a link group gated on the wrong condition.
#
# Release packaging is a separate workflow (release.yml) and needs a ROM.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Unix (macOS + Linux). Kept separate from Windows because the Windows job has
  # to run every step inside an MSYS2 shell, and `shell:` does not accept an
  # expression — GitHub rejects the whole workflow file if you try.
  engine-unix:
    name: engine + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2 ninja

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev ninja-build libcurl4-openssl-dev

      # The engine holds the real test coverage and is ROM-independent.
      - name: Configure engine
        working-directory: gbarecomp
        run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build engine
        working-directory: gbarecomp
        run: cmake --build build --parallel

      # oracle needs a vendored mGBA checkout; bios_intro_flawless needs a BIOS.
      # Both are excluded explicitly rather than left to fail.
      - name: Test engine
        working-directory: gbarecomp
        run: ctest --test-dir build -E "oracle|bios_intro_flawless" --output-on-failure

      # Compiles this repo's own non-generated sources against the engine
      # headers. Catches the class of break that only appears when the submodule
      # moves, without needing a ROM.
      - name: Compile game sources (no ROM)
        run: |
          set -euo pipefail
          INC="-Igbarecomp/src/runtime -Igbarecomp/src/gba -Igbarecomp/src/armv4t"
          INC="$INC -Isrc -Irecomp-ui/src -Irecomp-ui/src/common"
          for f in src/solar_weather.cpp src/game_ui.cpp; do
            echo "--- $f"
            c++ -std=c++20 -fsyntax-only $INC \
                -DGBARECOMP_RUNTIME_UI=1 -DRECOMP_RUNTIME_UI_HAS_TEXT=1 "$f"
          done

  # Windows builds with MSYS2 MinGW, not MSVC. bios_hle.cpp uses __builtin_clz,
  # which MSVC does not provide ("error C3861: '__builtin_clz': identifier not
  # found"), so a stock windows-2022 image tests a toolchain the engine does not
  # support. Upstream builds with MSYS2, so CI matches that.
  engine-windows:
    name: engine + tests (windows, mingw64)
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}

    steps:
      # checkout must NOT use the msys2 shell (the action runs node, not a shell,
      # but its post-step cleanup is happier with the default).
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-curl

      - name: Configure engine
        working-directory: gbarecomp
        run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build engine
        working-directory: gbarecomp
        run: cmake --build build --parallel

      - name: Test engine
        working-directory: gbarecomp
        run: ctest --test-dir build -E "oracle|bios_intro_flawless" --output-on-failure

  # The builder is what actually gets released, so it is the one target CI can
  # build to completion: it carries no ROM-derived sources at all. That is not a
  # claim to take on trust — GBAGAME_BUILDER_ONLY configures with no ROM present,
  # so if anything ever made the builder depend on generated code, this job fails.
  builder:
    name: builder (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2 ninja

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev ninja-build libcurl4-openssl-dev \
                                  libgl1-mesa-dev

      - name: Configure and build the builder (no ROM present)
        run: |
          set -euo pipefail
          cmake -B build-builder -S . -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DGBAGAME_BUILDER_ONLY=ON
          cmake --build build-builder --target BoktaiBuilder test_builder_core \
                --parallel

      - name: Unit-test the progress parser and the asset gate
        run: ./build-builder/test_builder_core

      # The builder must degrade usefully with nothing to build from, because
      # that is the state every player starts in. A crash or a silent success
      # here would both be wrong; the contract is a clear message and exit 1.
      - name: Pre-flight refuses to build with no assets
        run: |
          set -euo pipefail
          export BOKTAI_BUILDER_SOURCES="$PWD"
          export BOKTAI_BUILDER_DATA="$RUNNER_TEMP/builder-data"
          if ./build-builder/BoktaiBuilder --check > out.txt 2>&1; then
            echo "::error::--check passed with no ROM, which cannot be right"
            cat out.txt; exit 1
          fi
          cat out.txt
          grep -qi "cartridge" out.txt
          echo "refused with a message naming the missing asset"

      - name: The builder carries no cartridge-derived code
        run: |
          set -euo pipefail
          ./build-builder/BoktaiBuilder --paths
          # A ROM-free binary cannot contain the cartridge's own strings. This
          # would catch a future change that linked generated sources in.
          if strings build-builder/BoktaiBuilder 2>/dev/null \
               | grep -q "recompiled_"; then
            echo "::error::the builder appears to link recompiled sources"
            exit 1
          fi
          echo "no recompiled symbols in the builder binary"

  packaging:
    name: packaging scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Shell syntax
        run: |
          set -euo pipefail
          for s in gbarecomp/packaging/package_macos.sh \
                   gbarecomp/packaging/package_linux.sh \
                   gbarecomp/packaging/flatpak/build_flatpak.sh \
                   tools/package_builder_flatpak.sh; do
            bash -n "$s" && echo "ok: $s"
          done

      # Generation is testable without flatpak-builder; the build is not, since
      # it needs the recompiled sources.
      - name: Flatpak manifest generates and is valid YAML
        run: |
          set -euo pipefail
          gbarecomp/packaging/flatpak/build_flatpak.sh \
            --target BoktaiRecomp --name Boktai \
            --id tech.recomp.BoktaiRecomp --generate-only
          python3 -c "
          import yaml
          m = yaml.safe_load(open('flatpak-build/tech.recomp.BoktaiRecomp.yml'))
          assert m['command'] == 'BoktaiRecomp', m['command']
          assert m['id'] == 'tech.recomp.BoktaiRecomp', m['id']
          mods = [x['name'] for x in m['modules']]
          assert 'BoktaiRecomp' in mods, mods
          print('manifest OK:', mods)
          "

      # The skip list is what keeps the cartridge and BIOS out of the build
      # sandbox, so test the MECHANISM rather than asserting specific paths: CI
      # has no ROM or BIOS (both gitignored), so a real checkout legitimately
      # produces a skip list with neither in it. Plant decoys, regenerate, and
      # assert they were excluded.
      - name: Skip list actually excludes a ROM and BIOS when present
        run: |
          set -euo pipefail
          mkdir -p variants/boktai1_usa/roms
          : > variants/boktai1_usa/roms/decoy.gba
          : > gbarecomp/bios/gba_bios.bin
          gbarecomp/packaging/flatpak/build_flatpak.sh \
            --target BoktaiRecomp --name Boktai \
            --id tech.recomp.BoktaiRecomp --generate-only
          python3 -c "
          import yaml
          m = yaml.safe_load(open('flatpak-build/tech.recomp.BoktaiRecomp.yml'))
          src = [s for s in m['modules'][-1]['sources'] if s.get('type') == 'dir'][0]
          skip = src.get('skip', [])
          print('skip list:', skip)
          assert any(s.endswith('roms') for s in skip), 'roms dir not skipped'
          assert any('gba_bios.bin' in s for s in skip), 'BIOS not skipped'
          assert any('decoy.gba' in s for s in skip), 'ROM file not skipped'
          print('decoy ROM and BIOS are both excluded from the build sandbox')
          "
           rm -rf variants/boktai1_usa/roms gbarecomp/bios/gba_bios.bin

  builder-flatpak:
    name: builder flatpak manifest (Linux)
    runs-on: ubuntu-24.04
    needs: packaging
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Generate manifest with protected-data decoys
        run: |
          set -euo pipefail
          mkdir -p variants/boktai1_usa/roms \
                   variants/boktai1_usa/generated gbarecomp/bios
          : > variants/boktai1_usa/roms/ci-decoy.gba
          : > gbarecomp/bios/gba_bios.bin
          : > variants/boktai1_usa/generated/recompiled_ci_decoy.cpp
          tools/package_builder_flatpak.sh --generate-only

      - name: Validate builder Flatpak structure and exclusions
        run: |
          set -euo pipefail
          python3 -c "
          import yaml
          m = yaml.safe_load(open('flatpak-build/tech.recomp.BoktaiBuilder.yml'))
          assert m['runtime'] == 'org.freedesktop.Sdk', m['runtime']
          assert m['runtime-version'] == '23.08', m['runtime-version']
          assert m['sdk'] == 'org.freedesktop.Sdk', m['sdk']
          mod = next(x for x in m['modules'] if x['name'] == 'BoktaiBuilder')
          assert '-DGBAGAME_BUILDER_ONLY=ON' in mod['config-opts']
          commands = '\n'.join(mod['post-install'])
          assert '/app/bin/sources' in commands and 'tar -C ..' in commands
          assert '/app/bin/sources/bin/gba_recompile' in commands
          src = next(s for s in mod['sources'] if s.get('type') == 'dir')
          skip = set(src.get('skip', []))
          expected = {
              'variants/boktai1_usa/roms/ci-decoy.gba',
              'gbarecomp/bios/gba_bios.bin',
              'variants/boktai1_usa/generated',
              'variants/boktai1_usa/generated/recompiled_ci_decoy.cpp',
          }
          assert expected <= skip, expected - skip
          print('builder Flatpak manifest structure and decoy exclusions OK')
          "
