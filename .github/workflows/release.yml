# Publish only the ROM-free builder. Players supply their own ROM and BIOS.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for the draft release (for example v0.1.0)'
        required: true
        default: 'v0.0.1'

permissions:
  contents: write

jobs:
  builder:
    name: builder (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, label: macos-arm64 }
          - { os: ubuntu-24.04, label: linux-x86_64 }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2 ninja
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev ninja-build libcurl4-openssl-dev \
                                  libgl1-mesa-dev patchelf
      - name: Package the builder
        run: tools/package_builder.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BoktaiBuilder-${{ matrix.label }}
          path: release-stage/*.tar.gz
          if-no-files-found: error

  builder-flatpak:
    name: builder Flatpak (Steam Deck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Flatpak builder and runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          # Ubuntu 24.04 restricts unprivileged user namespaces through
          # AppArmor, and flatpak-builder sandboxes every build command with
          # bwrap, which needs them -- otherwise the build dies with
          # "bwrap: Creating new namespace failed: Operation not permitted".
          # Harmless on a throwaway runner; do not copy this onto a real machine.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          # The runtime IS the toolchain the builder compiles the game with, so
          # this is a ~1.5 GB download rather than a small base image.
          flatpak install -y --user flathub org.freedesktop.Sdk//23.08
      - name: Build the builder Flatpak
        run: tools/package_builder_flatpak.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BoktaiBuilder-flatpak
          path: flatpak-build/BoktaiBuilder.flatpak
          if-no-files-found: error

  draft-release:
    name: draft release
    needs: [builder, builder-flatpak]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::invalid release tag: $TAG"
            exit 1
          fi
          cat > /tmp/notes.md <<'EOF'
          These archives contain no game data. They contain BoktaiBuilder, which
          compiles the game locally from your own legally dumped ROM and GBA BIOS.

          Steam Deck: install `BoktaiBuilder.flatpak` in Desktop Mode with
          `flatpak install ./BoktaiBuilder.flatpak`, then launch it from the app
          menu or add BoktaiBuilder as a Non-Steam Game.

          Desktop Linux/macOS: extract the matching tarball and run BoktaiBuilder.
          EOF
          sed -i 's/^          //' /tmp/notes.md
          mapfile -t assets < <(find dist -type f \
            \( -name '*.tar.gz' -o -name '*.flatpak' \) -print | sort)
          [ "${#assets[@]}" -eq 3 ] || {
            echo "::error::expected two tarballs and one Flatpak"; exit 1;
          }
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
            --title "Boktai builder $TAG" --notes-file /tmp/notes.md "${assets[@]}"
